    function getFileType(fileName) {
      const ext = fileName.split('.').pop().toLowerCase();
      if (['webp', 'png', 'jpg', 'jpeg', 'gif', 'svg'].includes(ext)) return 'image';
      if (['mov', 'mp4', 'webm', 'mkv'].includes(ext)) return 'video';
      if (['wav', 'mp3', 'ogg', 'm4a', 'flac'].includes(ext)) return 'audio';
      return 'unknown';
    }

    function createMediaCard(item, src) {
      const card = document.createElement('div');
      card.className = 'media-card';

      const fileName = item.file || item.name;
      const type = getFileType(fileName);
      const description = item.description || '';

      let previewElement = '';
      if (type === 'image') {
        previewElement = `<img src="${src}" alt="media" loading="lazy">`;
      } else if (type === 'video') {

          <video src="${src}" muted loop playsinline></video>

        `;
      } else if (type === 'audio') {
        previewElement = `<audio src="${src}" controls></audio>`;
      }

      card.innerHTML = `
        <div class="media-preview">${previewElement}</div>
        ${description ? `<div class="media-info"><div class="media-description">${description}</div></div>` : ''}
      `;

      // Video hover autoplay effect

      });

      return card;
    }

    // Populate grid

      mediaGrid.appendChild(createMediaCard(item, filePath));
    });

    /* =========================================================

    function openModal(type, src, fileName, caption) {
      modalContent.innerHTML = '';

      if (type === 'image') {

      } else if (type === 'audio') {
        modalContent.innerHTML = `<audio src="${src}" controls autoplay></audio>`;
      }

      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      modalContent.innerHTML = ''; // Stops audio/video playback
      modalFilename.textContent = '';
      modalCaption.textContent = '';
    }

    modalClose.addEventListener('click', closeModal);

    /* =========================================================

    const canvas = document.getElementById('sparkle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', e => {
      for (let i = 0; i < 3; i++) {
        particles.push({
          x: e.clientX,
          y: e.clientY,
          size: Math.random() * 3 + 1,
          speedX: (Math.random() - 0.5) * 1.5,
          speedY: (Math.random() - 0.5) * 1.5,
          life: 1,
          decay: Math.random() * 0.03 + 0.015
        });
      }
    });

    function animateSparkles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.speedX;
        p.y += p.speedY;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ffffff";
        ctx.fill();
      }

      requestAnimationFrame(animateSparkles);
    }
    animateSparkles();
